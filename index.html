<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentry Console</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            background-color: rgb(0, 0, 0);
            color: rgb(180, 180, 180);
            font-family: monospace;
            font-size: 13px;
            line-height: 1.5;
            padding: 25px;
            display: flex;
            flex-direction: column;
        }
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgb(30, 30, 30);
            padding-bottom: 15px;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        .logo {
            color: rgb(255, 255, 255);
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .dashboard {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            flex-grow: 1;
            height: calc(100% - 60px);
            min-height: 0;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-shrink: 0;
        }
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
            min-height: 0;
        }
        .panel {
            border: 1px solid rgb(30, 30, 30);
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .ledger-panel {
            flex-grow: 3;
            height: 60%;
        }
        .log-panel {
            flex-grow: 2;
            height: 40%;
        }
        .panel-title {
            color: rgb(255, 255, 255);
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 11px;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgb(20, 20, 20);
        }
        .metric-label {
            color: rgb(110, 110, 110);
        }
        .metric-val {
            color: rgb(255, 255, 255);
            font-weight: bold;
        }
        .config-row {
            display: flex;
            justify-content: space-between;
            color: rgb(110, 110, 110);
            padding: 6px 0;
        }
        .test-btn {
            width: 100%;
            background-color: transparent;
            border: 1px solid rgb(255, 145, 0);
            color: rgb(255, 145, 0);
            font-family: monospace;
            font-size: 11px;
            font-weight: bold;
            padding: 8px;
            margin-top: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        .test-btn:hover {
            background-color: rgba(255, 145, 0, 0.1);
            color: rgb(255, 255, 255);
        }
        .ledger-view {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
            overflow-y: auto;
            min-height: 0;
        }
        .empty-state {
            color: rgb(80, 80, 80);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        .threat-card {
            border: 1px solid rgb(40, 40, 40);
            background-color: rgb(5, 5, 5);
            padding: 15px;
            flex-shrink: 0;
        }
        .threat-card.active-alert {
            border-color: rgb(200, 30, 60);
        }
        .threat-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgb(25, 25, 25);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .threat-title {
            color: rgb(200, 30, 60);
            font-weight: bold;
        }
        .threat-time {
            color: rgb(100, 100, 100);
        }
        .threat-details {
            display: grid;
            grid-template-columns: 90px 1fr;
            gap: 6px 10px;
        }
        .label {
            color: rgb(100, 100, 100);
        }
        .val {
            color: rgb(210, 210, 210);
            word-break: break-all;
        }
        .console {
            background-color: rgb(2, 2, 2);
            flex-grow: 1;
            overflow-y: auto;
            padding: 12px;
            font-size: 11px;
            min-height: 0;
        }
        .log-line {
            color: rgb(30, 160, 90);
            margin-bottom: 3px;
        }
        .log-line.warn {
            color: rgb(255, 145, 0);
        }
        .log-line.alert {
            color: rgb(200, 30, 60);
            font-weight: bold;
        }
        .log-line.info {
            color: rgb(100, 100, 100);
        }
    </style>
</head>
<body>
    <header class="main-header">
        <span class="logo">CANARY</span>
    </header>

    <main class="dashboard">
        <aside class="sidebar">
            <div class="panel">
                <div class="panel-title">System Metrics</div>
                <div class="metric">
                    <span class="metric-label">Decoys Active</span>
                    <span class="metric-val">3</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Mitigations</span>
                    <span class="metric-val class-mitigation-count">0</span>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">Configuration</div>
                <div class="config-row">
                    <span>Engine</span>
                    <span>SQLITE3</span>
                </div>
                <div class="config-row">
                    <span>Interval</span>
                    <span>50ms</span>
                </div>
                <button class="test-btn" onclick="runSelfTest()">Run Threat Simulation</button>
            </div>
        </aside>

        <section class="main-content">
            <div class="panel ledger-panel">
                <div class="panel-title">Neutralized Threats</div>
                <div class="ledger-view">
                    <div class="empty-state">No incidents recorded. System secure.</div>
                </div>
            </div>

            <div class="panel log-panel">
                <div class="panel-title">Diagnostic Feed</div>
                <div class="console"></div>
            </div>
        </section>
    </main>

    <script>
        let mitigations = 0;

        const bootLogs = [
            { text: "Canary Engine Release v1.4.0 initializing...", level: "info" },
            { text: "Dynamic whitelisting subsystem successfully loaded.", level: "info" },
            { text: "Canary target entropy validations initiated.", level: "info" },
            { text: "Verified: _critical_ledger.docx (SHA-256 entropy aligned).", level: "info" },
            { text: "Verified: 00_database_backup.db (SHA-256 entropy aligned).", level: "info" },
            { text: "Verified: 0_auth_vault.txt (SHA-256 entropy aligned).", level: "info" },
            { text: "SQLite storage parameters successfully optimized (canary_v2.db).", level: "info" },
            { text: "Sentry Core background monitor thread active (CWD matched).", level: "info" }
        ];

        function writeLog(text, level = "info") {
            const consoleEl = document.querySelector(".console");
            if (!consoleEl) return;
            const line = document.createElement("div");
            line.className = "log-line " + level;
            const time = new Date().toTimeString().split(" ")[0];
            line.textContent = "[" + time + "] " + text;
            consoleEl.appendChild(line);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        function playBootSequence(callback) {
            let delay = 0;
            bootLogs.forEach((log, index) => {
                setTimeout(() => {
                    writeLog(log.text, log.level);
                    if (index === bootLogs.length - 1) {
                        setTimeout(callback, 200);
                    }
                }, delay);
                delay += 120;
            });
        }

        function createThreatCard(event, prepend = true) {
            const view = document.querySelector(".ledger-view");
            const empty = document.querySelector(".empty-state");
            if (empty) empty.style.display = "none";

            const card = document.createElement("div");
            card.className = "threat-card active-alert";

            const header = document.createElement("div");
            header.className = "threat-header";

            const title = document.createElement("span");
            title.className = "threat-title";
            const exeName = event.exe.split("\\").pop().split("/").pop();
            title.textContent = "BLOCK: " + exeName;

            const time = document.createElement("span");
            time.className = "threat-time";
            time.textContent = event.timestamp;

            header.appendChild(title);
            header.appendChild(time);
            card.appendChild(header);

            const details = document.createElement("div");
            details.className = "threat-details";

            const fields = [
                { label: "Decoy:", val: event.decoy_file },
                { label: "Event:", val: event.event_type },
                { label: "PID/PPID:", val: event.pid + " / " + event.ppid },
                { label: "Path:", val: event.exe },
                { label: "CLI:", val: event.cmdline },
                { label: "Status:", val: event.status, style: "color: rgb(30, 160, 90);" }
            ];

            fields.forEach(f => {
                const lblSpan = document.createElement("span");
                lblSpan.className = "label";
                lblSpan.textContent = f.label;

                const valSpan = document.createElement("span");
                valSpan.className = "val";
                valSpan.textContent = f.val;
                if (f.style) {
                    valSpan.setAttribute("style", f.style);
                }

                details.appendChild(lblSpan);
                details.appendChild(valSpan);
            });

            card.appendChild(details);

            if (event.pid > 0 && event.status !== "Bypassed (Trusted)" && event.event_type !== "ENGINE_STARTUP") {
                const actionsDiv = document.createElement("div");
                actionsDiv.style.marginTop = "12px";
                actionsDiv.style.display = "flex";
                actionsDiv.style.justifyContent = "flex-end";

                const wlBtn = document.createElement("button");
                wlBtn.textContent = "Trust & Whitelist Process";
                wlBtn.style.backgroundColor = "transparent";
                wlBtn.style.border = "1px solid rgb(255, 145, 0)";
                wlBtn.style.color = "rgb(255, 145, 0)";
                wlBtn.style.fontFamily = "monospace";
                wlBtn.style.fontSize = "10px";
                wlBtn.style.padding = "4px 8px";
                wlBtn.style.cursor = "pointer";
                wlBtn.style.transition = "all 0.2s ease";

                wlBtn.onmouseover = () => {
                    wlBtn.style.backgroundColor = "rgba(255, 145, 0, 0.1)";
                    wlBtn.style.color = "rgb(255, 255, 255)";
                };
                wlBtn.onmouseout = () => {
                    wlBtn.style.backgroundColor = "transparent";
                    wlBtn.style.color = "rgb(255, 145, 0)";
                };

                wlBtn.onclick = async () => {
                    writeLog("Sending trust policy request for: " + exeName, "warn");
                    try {
                        const res = await fetch("/api/whitelist/add", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ proc_name: exeName })
                        });
                        if (res.ok) {
                            writeLog("Policy updated: " + exeName + " is now marked as Trusted.", "info");
                            wlBtn.textContent = "Added to Whitelist";
                            wlBtn.disabled = true;
                            wlBtn.style.borderColor = "rgb(30, 160, 90)";
                            wlBtn.style.color = "rgb(30, 160, 90)";
                            wlBtn.style.backgroundColor = "transparent";
                            wlBtn.onmouseover = null;
                            wlBtn.onmouseout = null;
                        }
                    } catch (err) {
                        writeLog("Failed to sync trust policy with database.", "warn");
                    }
                };

                actionsDiv.appendChild(wlBtn);
                card.appendChild(actionsDiv);
            }

            if (prepend) {
                view.insertBefore(card, view.firstChild);
            } else {
                view.appendChild(card);
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch("/api/history");
                const data = await res.json();
                if (data.length > 0) {
                    mitigations = data.filter(e => e.event_type !== "ENGINE_STARTUP").length;
                    document.querySelector(".class-mitigation-count").textContent = mitigations;
                    document.querySelector(".empty-state").style.display = "none";
                    data.forEach(item => createThreatCard(item, false));
                    writeLog("Retrieved " + data.length + " historical security events.", "info");
                } else {
                    writeLog("Telemetry ledger validated. 0 incidents found.", "info");
                }
            } catch (e) {
                writeLog("Failed to pull analytical history from DB.", "warn");
            }
        }

        async function runSelfTest() {
            writeLog("Initiating synthetic threat simulation...", "warn");
            try {
                const res = await fetch("/api/test");
                const data = await res.json();
                if (res.ok) {
                    writeLog("Simulation signal transmitted successfully.", "info");
                }
            } catch (e) {
                writeLog("Failed to contact simulation endpoint.", "warn");
            }
        }

        function initEventStream() {
            const stream = new EventSource("/api/events");

            stream.onopen = () => {
                writeLog("Sentry bridge successfully established.", "info");
            };

            stream.onerror = () => {
                writeLog("Telemetry pipeline disconnected. Retrying...", "warn");
            };

            stream.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.status === "connected") {
                        writeLog("Active filesystem monitoring verified.", "info");
                        return;
                    }
                    if (data.event_type !== "ENGINE_STARTUP") {
                        mitigations++;
                        document.querySelector(".class-mitigation-count").textContent = mitigations;
                    }
                    writeLog("FILE ALERT: " + data.event_type + " action registered on " + data.decoy_file, "alert");
                    writeLog("CONTAINMENT: Process PID " + data.pid + " killed.", "alert");
                    createThreatCard(data, true);
                } catch (err) {}
            };
        }

        window.onload = () => {
            playBootSequence(() => {
                writeLog("Establishing analytics pipeline...", "info");
                loadHistory();
                initEventStream();
            });
        };
    </script>
</body>
</html>
